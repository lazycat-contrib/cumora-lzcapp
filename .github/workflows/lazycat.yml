name: Publish LazyCat application

on:
  # Daily check for a new upstream Cumora release. GitHub Actions cron is UTC.
  schedule:
    - cron: "41 10 * * *"
  pull_request:
    paths:
      - .github/lazycat-action.yml
      - .github/workflows/lazycat.yml
      - lzc-build.yml
      - lzc-manifest.yml
      - package.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lazycat:
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1
    with:
      operation: auto
      config: .github/lazycat-action.yml
      dry-run: ${{ github.event_name == 'pull_request' }}
      versioned-release-asset: true
    # Organization Secrets must authorize this repository; a same-name
    # Repository Secret overrides them. Only the Miaomiao store is enabled.
    secrets:
      APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
      APP_ID: ${{ secrets.APP_ID }}
      PRIVATE_STORE_GROUP_CODES: ${{ secrets.PRIVATE_STORE_GROUP_CODES }}
